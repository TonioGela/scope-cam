# Same build F-Droid runs on each tag (assembleRelease), plus the unit tests, so a broken tag shows up here first.
# On a v* tag it also publishes a signed APK as a GitHub release, with notes from the fastlane changelog.
name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only the release step on tags needs it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # The Android SDK comes preinstalled on GitHub's Ubuntu runners.
      - run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          version_code=$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' build.gradle.kts)
          version_name=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$version_name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version_name"; exit 1
          fi
          notes=fastlane/metadata/android/en-US/changelogs/$version_code.txt
          if [ ! -f "$notes" ]; then echo "::error::Missing $notes"; exit 1; fi

          apk=ScopeCam-$version_name.apk
          unsigned=build/outputs/apk/release/scope-camera-release-unsigned.apk
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Keep the APK reproducible, so F-Droid can ship this exact file: AGP already aligned it, so don't re-align,
          # and skip the v1 (JAR) signature (useless at minSdk 30), whose entries apksigcopier can't recreate byte for byte.
          apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled false --alignment-preserved true --out "$apk" "$unsigned"
          # The check F-Droid runs: copy our signature onto the unsigned build and verify it.
          pipx run apksigcopier==1.1.1 compare "$apk" --unsigned "$unsigned"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "ScopeCam $version_name" --notes-file "$notes"
