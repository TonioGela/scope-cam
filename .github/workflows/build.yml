# Same build F-Droid runs on each tag (assembleRelease), plus the unit tests, so a broken tag shows up here first.
# On a v* tag it also publishes a signed APK as a GitHub release, with notes from the fastlane changelog.
name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only the release step on tags needs it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # The Android SDK comes preinstalled on GitHub's Ubuntu runners.
      - run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          version_code=$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' build.gradle.kts)
          version_name=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$version_name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version_name"; exit 1
          fi
          notes=fastlane/metadata/android/en-US/changelogs/$version_code.txt
          if [ ! -f "$notes" ]; then echo "::error::Missing $notes"; exit 1; fi

          apk=ScopeCam-$version_name.apk
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --out "$apk" build/outputs/apk/release/scope-camera-release-unsigned.apk
          gh release create "$GITHUB_REF_NAME" "$apk" --title "ScopeCam $version_name" --notes-file "$notes"
